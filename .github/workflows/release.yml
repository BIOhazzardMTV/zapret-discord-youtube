name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true

jobs:
  build-launcher:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build launcher
        shell: powershell
        run: .\launcher\build.ps1

      - name: Run Windows tests
        shell: powershell
        run: |
          .\launcher\build.ps1 -Test
          .\tests\Maintenance.Tests.ps1

      - name: Upload built launcher
        uses: actions/upload-artifact@v7
        with:
          name: winws-launcher
          path: bin/winws.exe
          if-no-files-found: error

  release:
    needs: build-launcher
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify version matches version.txt
        run: |
          VERSION=$(cat .service/version.txt)
          if [ "$VERSION" != "${{ github.event.inputs.tag }}" ]; then
            echo "Error: tag '${{ github.event.inputs.tag }}' does not match .service/version.txt ('$VERSION')"
            exit 1
          fi

      - name: Download tested launcher
        uses: actions/download-artifact@v8
        with:
          name: winws-launcher
          path: release-launcher

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip tar rar

      - name: Prepare release bundle
        run: |
          NAME="zapret-discord-youtube-${{ github.event.inputs.tag }}"

          mkdir "$NAME"

          cp -r bin "$NAME/"
          cp release-launcher/winws.exe "$NAME/bin/winws.exe"
          cp -r lists "$NAME/"
          cp -r utils "$NAME/"
          cp *.bat "$NAME/"
          cp LICENSE.txt "$NAME/"

      - name: Create archives
        run: |
          NAME="zapret-discord-youtube-${{ github.event.inputs.tag }}"

          zip -qr "${NAME}.zip" "$NAME"
          rar a -idq "${NAME}.rar" "$NAME"
          tar --owner=0 --group=0 -czf "${NAME}.tar.gz" "$NAME"

      - name: Generate SHA256 checksums
        run: |
          NAME="zapret-discord-youtube-${{ github.event.inputs.tag }}"

          sha256sum \
            "${NAME}.zip" \
            "${NAME}.rar" \
            "${NAME}.tar.gz" > "${NAME}-SHA256SUMS.txt"
          cat "${NAME}-SHA256SUMS.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          fail_on_unmatched_files: true
          files: |
            zapret-discord-youtube-${{ github.event.inputs.tag }}.zip
            zapret-discord-youtube-${{ github.event.inputs.tag }}.rar
            zapret-discord-youtube-${{ github.event.inputs.tag }}.tar.gz
            zapret-discord-youtube-${{ github.event.inputs.tag }}-SHA256SUMS.txt
